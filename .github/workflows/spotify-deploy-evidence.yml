name: Spotify Analytics - Deploy Evidence

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "spotify-analytics/evidence/**"
      - ".github/workflows/spotify-deploy-evidence.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: spotify-analytics-pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: spotify-analytics/evidence/package-lock.json

      - name: Install Evidence dependencies
        working-directory: spotify-analytics/evidence
        run: npm ci --no-audit --no-fund

      - name: Build Evidence sources
        working-directory: spotify-analytics/evidence
        run: npm run sources

      - name: Configure GitHub Pages base path
        working-directory: spotify-analytics/evidence
        run: |
          sed -i "s|basePath:.*|basePath: /${GITHUB_REPOSITORY#*/}|" evidence.config.yaml

      - name: Build static Evidence site
        working-directory: spotify-analytics/evidence
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: spotify-analytics/evidence/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
