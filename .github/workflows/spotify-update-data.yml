name: Spotify Analytics - Update Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spotify-analytics/scripts/requirements-public.txt

      - name: Install public pipeline dependencies
        run: pip install -r spotify-analytics/scripts/requirements-public.txt

      - name: Validate Spotify secrets
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          test -n "$SPOTIFY_CLIENT_ID" || (echo "SPOTIFY_CLIENT_ID repository secret is missing." && exit 1)
          test -n "$SPOTIFY_CLIENT_SECRET" || (echo "SPOTIFY_CLIENT_SECRET repository secret is missing." && exit 1)

      - name: Refresh public Spotify snapshot
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python spotify-analytics/scripts/refresh_public_data.py

      - name: Commit refreshed datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spotify-analytics/data/raw spotify-analytics/evidence/sources/spotify_public
          git diff --cached --quiet || git commit -m "chore(spotify): refresh public chart data"
          git push

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: spotify-analytics/evidence/package-lock.json

      - name: Install Evidence dependencies
        working-directory: spotify-analytics/evidence
        run: npm ci --no-audit --no-fund

      - name: Build Evidence sources
        working-directory: spotify-analytics/evidence
        run: npm run sources

      - name: Configure GitHub Pages base path
        working-directory: spotify-analytics/evidence
        run: |
          sed -i "s|basePath:.*|basePath: /${GITHUB_REPOSITORY#*/}|" evidence.config.yaml

      - name: Build Evidence static site
        working-directory: spotify-analytics/evidence
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: spotify-analytics/evidence/build

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
