version: 2

models:
  - name: fct_asset_returns
    description: "Rendimenti giornalieri multi-asset con feature engineering"
    columns:
      - name: symbol
        tests: [not_null]
      - name: date
        tests: [not_null]
      - name: log_return
        tests: [not_null]

  - name: fct_risk_metrics
    description: "Metriche di rischio aggregate per asset"
    columns:
      - name: symbol
        tests: [not_null, unique]
