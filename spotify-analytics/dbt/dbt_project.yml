name: spotify_analytics
version: "1.0.0"
config-version: 2

profile: spotify_analytics

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  spotify_analytics:
    staging:
      +materialized: view
      +schema: "{{ env_var('SPOTIFY_BQ_STAGING_DATASET', 'spotify_analytics_staging') }}"
    intermediate:
      +materialized: view
      +schema: "{{ env_var('SPOTIFY_BQ_INTERMEDIATE_DATASET', 'spotify_analytics_intermediate') }}"
    marts:
      +materialized: table
      +schema: "{{ env_var('SPOTIFY_BQ_MARTS_DATASET', 'spotify_analytics_marts') }}"
      +labels:
        application: spotify-analytics
        managed_by: dbt
      fct_track_chart_daily:
        +partition_by: {field: chart_date, data_type: date, granularity: day}
        +require_partition_filter: true
        +cluster_by: [country, chart_track_id]
      mart_album_release_analysis:
        +partition_by: {field: chart_date, data_type: date, granularity: day}
        +require_partition_filter: true
        +cluster_by: [country, spotify_album_id]
      mart_artist_market_share:
        +partition_by: {field: chart_date, data_type: date, granularity: day}
        +require_partition_filter: true
        +cluster_by: [country, spotify_artist_id]
      mart_chart_concentration:
        +partition_by: {field: chart_date, data_type: date, granularity: day}
        +require_partition_filter: true
        +cluster_by: [country]
      mart_chart_entries_exits:
        +partition_by: {field: chart_date, data_type: date, granularity: day}
        +require_partition_filter: true
        +cluster_by: [country, chart_track_id]
      mart_chart_momentum:
        +partition_by: {field: chart_date, data_type: date, granularity: day}
        +require_partition_filter: true
        +cluster_by: [chart_rank]
      mart_data_quality_daily:
        +partition_by: {field: chart_date, data_type: date, granularity: day}
        +require_partition_filter: true
        +cluster_by: [country]
      mart_release_cohorts:
        +partition_by: {field: chart_date, data_type: date, granularity: day}
        +require_partition_filter: true
        +cluster_by: [country, release_cohort_month]
      mart_top_artists_italy:
        +partition_by: {field: chart_date, data_type: date, granularity: day}
        +require_partition_filter: true
        +cluster_by: [country, spotify_artist_id]
      mart_top_songs_italy:
        +partition_by: {field: chart_date, data_type: date, granularity: day}
        +require_partition_filter: true
        +cluster_by: [country, chart_track_id]
      mart_track_lifecycle:
        +cluster_by: [country, chart_track_id]
    reporting:
      +materialized: view
      +schema: "{{ env_var('SPOTIFY_BQ_MARTS_DATASET', 'spotify_analytics_marts') }}"
      +labels:
        application: spotify-analytics
        managed_by: dbt
        consumption: data-studio
