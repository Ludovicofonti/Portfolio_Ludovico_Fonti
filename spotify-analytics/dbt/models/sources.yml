version: 2

sources:
  - name: spotify_raw
    description: Partitioned raw tables loaded into BigQuery from Kworb and Spotify Web API.
    schema: "{{ env_var('SPOTIFY_BQ_RAW_DATASET', 'spotify_analytics_raw') }}"
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 36, period: hour}
        error_after: {count: 48, period: hour}
        filter: "chart_date >= date_sub(current_date(), interval 365 day)"
    tables:
      - name: italy_daily_chart
        description: Daily Spotify Italy Top 200 chart from Kworb.
        columns:
          - name: _dlt_id
            tests:
              - not_null:
                  config: &raw_partition_test
                    where: "chart_date >= date_sub(current_date(), interval 365 day)"
              - unique:
                  config: *raw_partition_test
          - name: chart_date
            tests:
              - not_null:
                  config: *raw_partition_test
          - name: rank
            tests:
              - not_null:
                  config: *raw_partition_test
          - name: track_id
            tests:
              - not_null:
                  config: *raw_partition_test
          - name: streams
            tests:
              - not_null:
                  config: *raw_partition_test

      - name: italy_daily_track_details
        description: Track metadata enriched deterministically via Spotify Track ID.
        columns:
          - name: _dlt_id
            tests:
              - not_null:
                  config: *raw_partition_test
              - unique:
                  config: *raw_partition_test
          - name: id
            tests:
              - not_null:
                  config: *raw_partition_test
          - name: chart_track_id
            tests:
              - not_null:
                  config: *raw_partition_test
          - name: chart_rank
            tests:
              - not_null:
                  config: *raw_partition_test

      - name: italy_daily_track_details__artists
        description: Normalized Spotify artists for each enriched track.
        columns:
          - name: _dlt_id
            tests:
              - not_null:
                  config: *raw_partition_test
              - unique:
                  config: *raw_partition_test
          - name: _dlt_parent_id
            tests:
              - not_null:
                  config: *raw_partition_test
          - name: id
            tests:
              - not_null:
                  config: *raw_partition_test

      - name: italy_daily_track_details__album__images
        description: Normalized album artwork images for enriched tracks.
        columns:
          - name: _dlt_id
            tests:
              - not_null:
                  config: *raw_partition_test
              - unique:
                  config: *raw_partition_test
          - name: _dlt_parent_id
            tests:
              - not_null:
                  config: *raw_partition_test
