version: 2

models:
  - name: fct_track_chart_daily
    description: Incremental daily chart fact at chart_date, country and Spotify Track ID grain.
    columns:
      - name: chart_date
        tests: [not_null]
      - name: country
        tests:
          - not_null:
              config:
                where: "chart_date >= cast('2000-01-01' as date)"
      - name: chart_track_id
        tests:
          - not_null:
              config:
                where: "chart_date >= cast('2000-01-01' as date)"
      - name: chart_rank
        tests:
          - not_null:
              config:
                where: "chart_date >= cast('2000-01-01' as date)"
      - name: streams
        tests:
          - not_null:
              config:
                where: "chart_date >= cast('2000-01-01' as date)"

  - name: mart_data_quality_daily
    description: Daily completeness, duplication and metadata coverage health indicators.
    columns:
      - name: chart_date
        tests: [not_null]
      - name: pipeline_status
        tests:
          - accepted_values:
              arguments:
                values: [fresh, degraded]
              config:
                where: "chart_date >= cast('2000-01-01' as date)"

  - name: mart_track_lifecycle
    description: Track persistence, observed peak and deterministic lifecycle classification.
    columns:
      - name: chart_track_id
        tests: [not_null, unique]

  - name: mart_top_songs_italy
    description: One row per charted song enriched with Spotify metadata and portfolio-ready metrics.
    columns:
      - name: chart_date
        tests:
          - not_null
      - name: chart_rank
        tests:
          - not_null:
              config:
                where: "chart_date >= cast('2000-01-01' as date)"
      - name: track_name
        tests:
          - not_null:
              config:
                where: "chart_date >= cast('2000-01-01' as date)"
      - name: streams
        tests:
          - not_null:
              config:
                where: "chart_date >= cast('2000-01-01' as date)"

  - name: mart_top_artists_italy
    description: Artist-level aggregation of daily Top 200 streams.
    columns:
      - name: chart_date
        tests:
          - not_null
      - name: artist_name
        tests:
          - not_null:
              config:
                where: "chart_date >= cast('2000-01-01' as date)"
      - name: streams
        tests:
          - not_null:
              config:
                where: "chart_date >= cast('2000-01-01' as date)"

  - name: mart_album_release_analysis
    description: Album and release-level chart performance.
    columns:
      - name: chart_date
        tests:
          - not_null
      - name: spotify_album_id
        tests:
          - not_null:
              config:
                where: "chart_date >= cast('2000-01-01' as date)"

  - name: mart_chart_momentum
    description: Song-level rank and stream movement for trend views.
    columns:
      - name: chart_date
        tests:
          - not_null
      - name: chart_rank
        tests:
          - not_null:
              config:
                where: "chart_date >= cast('2000-01-01' as date)"
