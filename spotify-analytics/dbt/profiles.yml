spotify_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'airflow') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'airflow') }}"
      dbname: "{{ env_var('POSTGRES_SPOTIFY_DB', 'spotify_db') }}"
      schema: spotify_marts
      threads: 4
      keepalives_idle: 0
      connect_timeout: 10
    bigquery:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID', env_var('GOOGLE_CLOUD_PROJECT', 'spotify-analytics-ci')) }}"
      dataset: "{{ env_var('SPOTIFY_BQ_MARTS_DATASET', 'spotify_analytics_marts') }}"
      location: "{{ env_var('BIGQUERY_LOCATION', 'EU') }}"
      priority: interactive
      maximum_bytes_billed: "{{ env_var('BIGQUERY_MAXIMUM_BYTES_BILLED', '10000000000') | int }}"
      threads: 4
