[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=scripts --cov-report=term-missing --cov-fail-under=40"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["dbt/target", "graphify-out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
omit = [
  "scripts/load_bigquery_raw.py",
  "scripts/run_public_pipeline.py",
]
