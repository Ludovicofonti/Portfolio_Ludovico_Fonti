[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=dlt --cov=scripts --cov-report=term-missing --cov-fail-under=40"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["airflow/logs", "dbt/target", "evidence/node_modules", "graphify-out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
omit = [
  "dlt/spotify_pipeline.py",
  "dlt/spotify_source.py",
  "scripts/export_bigquery_marts.py",
  "scripts/load_bigquery_raw.py",
  "scripts/run_public_pipeline.py",
]
